name: common_utils2
description: A comprehensive Flutter utilities package — push/local/in-app notifications, storage (Hive CE, secure, prefs), connectivity, logging, Result types, countries & dial codes, currency, validators, media and more.
version: 4.0.0
homepage: https://github.com/mhista/common_utils
repository: https://github.com/mhista/common_utils
issue_tracker: https://github.com/mhista/common_utils/issues
documentation: https://github.com/mhista/common_utils#readme

topics:
  - utilities
  - notifications
  - storage
  - validation
  - networking

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Flutter 3.47 moved Material out of the SDK. The in-framework
  # package:flutter/material.dart is frozen and scheduled for deprecation.
  material_ui: ^1.4.0

  # ── State ────────────────────────────────────────────────────────────────
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ── HTTP & Network ───────────────────────────────────────────────────────
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # ── Storage ──────────────────────────────────────────────────────────────
  shared_preferences: ^2.5.5
  # hive_flutter (1.1.0) has been unmaintained since 2021. hive_ce is the
  # community-maintained, drop-in compatible fork (same on-disk format).
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.4.0
  flutter_secure_storage: ^11.2.0

  # ── Location ─────────────────────────────────────────────────────────────
  geolocator: ^14.1.1
  geocoding: ^5.0.0

  # ── Device Info ──────────────────────────────────────────────────────────
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

  # ── Logging (Talker) ─────────────────────────────────────────────────────
  talker: ^5.1.20
  talker_flutter: ^5.1.20
  talker_bloc_logger: ^5.1.20
  talker_dio_logger: ^5.1.17

  # ── Images & Files ───────────────────────────────────────────────────────
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  cached_network_image: ^4.0.2
  flutter_cache_manager: ^3.4.5
  permission_handler: ^13.0.2

  # ── Media ────────────────────────────────────────────────────────────────
  video_player: ^2.14.0
  chewie: ^1.17.1
  video_thumbnail: ^0.5.6
  visibility_detector: ^0.4.0+2

  # ── Encryption & Security ────────────────────────────────────────────────
  crypto: ^3.0.7
  encrypt: ^5.0.3

  # ── Formatting ───────────────────────────────────────────────────────────
  intl: ^0.20.3

  # ── Notifications ────────────────────────────────────────────────────────
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # Removed in 4.0.0 (were declared but never imported):
  #   injectable, pdfx
  # Removed earlier (engine experiments), kept out on purpose:
  #   media_kit, media_kit_video, media_kit_libs_video, pdf_render

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  # Wide ranges on purpose: freezed 4 needs Dart 3.13 + analyzer 14; letting
  # pub pick the newest mutually-compatible generator set avoids solver dead-ends.
  freezed: ">=3.2.5 <5.0.0"
  json_serializable: ">=6.13.0 <7.0.0"

flutter:
  uses-material-design: true
